<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2a12" />
  <title>丛林尖兵 JUNGLE BLITZ · 横版跑射</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Play field -->
  <canvas id="game"></canvas>

  <!-- Back to Hub (top-left) -->
  <a id="back-to-hub" href="../../index.html" title="返回游戏中心 / Back to Hub">← HUB</a>

  <!-- Mute toggle (top-right) -->
  <button id="btn-mute" type="button" title="静音 / 声音 (M)">🔊</button>

  <!-- stage banner (transient) -->
  <div id="stage-banner" class="stage-banner"><span id="sb-text"></span></div>

  <!-- overlays: menu / pause / stageclear / gameover / win  (panels filled in a later task) -->
  <div id="overlay-menu" class="overlay show">
    <div class="panel">
      <h1 class="game-title">🪖 丛林尖兵</h1>
      <p class="game-sub">横版跑射 · 闯关打 BOSS</p>
      <button id="btn-start" class="big-btn" type="button">▶ 开始游戏</button>
      <p id="menu-best" class="best-line">🏆 最高分 0 · 最远第 1 关</p>
      <div class="hints">
        <span><b>← →</b> 移动</span>
        <span><b>空格 / K</b> 跳跃</span>
        <span><b>J / X</b> 射击（按住连发）</span>
        <span><b>↑ ↓</b> 瞄准（上 / 斜上 / 蹲射）</span>
        <span><b>Esc</b> 暂停</span>
        <span><b>手柄</b> 摇杆移动 · ✕ 跳 · □ 射击</span>
      </div>
    </div>
  </div>
  <div id="overlay-pause" class="overlay">
    <div class="panel">
      <h1 class="game-title">⏸ 暂停</h1>
      <div class="btn-col">
        <button id="btn-resume" class="big-btn" type="button">▶ 继续</button>
        <button id="btn-restart" class="big-btn ghost" type="button">↻ 重玩本关</button>
        <a class="big-btn ghost" href="../../index.html">← 返回 HUB</a>
      </div>
      <p class="tiny">← → 移动 · 空格 跳 · J 射击 · ↑↓ 瞄准</p>
    </div>
  </div>

  <div id="overlay-stageclear" class="overlay">
    <div class="panel">
      <h1 id="sc-title" class="game-title">🎉 通关！</h1>
      <p id="sc-score" class="best-line"></p>
      <div class="btn-col">
        <button id="btn-next" class="big-btn" type="button">下一关 →</button>
      </div>
      <p class="tiny">按 空格 / 手柄 ✕ 继续</p>
    </div>
  </div>

  <div id="overlay-gameover" class="overlay">
    <div class="panel">
      <h1 class="game-title">😺 再接再厉！</h1>
      <p id="go-score" class="best-line"></p>
      <p id="go-best" class="tiny"></p>
      <div class="btn-col">
        <button id="btn-continue" class="big-btn" type="button">↻ 从复活点再来</button>
        <button id="btn-go-menu" class="big-btn ghost" type="button">选择</button>
        <a class="big-btn ghost" href="../../index.html">← 返回 HUB</a>
      </div>
    </div>
  </div>

  <div id="overlay-win" class="overlay">
    <div class="panel">
      <h1 class="game-title">🏆 全部通关！</h1>
      <p id="win-score" class="best-line"></p>
      <p id="win-best" class="tiny"></p>
      <div class="btn-col">
        <button id="btn-win-retry" class="big-btn" type="button">↻ 再玩一次</button>
        <a class="big-btn ghost" href="../../index.html">← 返回 HUB</a>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
