<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>炮炮虫 BOOM WORMS · 回合制炮战</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Play field -->
  <canvas id="game"></canvas>

  <!-- Back to Hub (top-left) -->
  <a id="back-to-hub" href="../../index.html" title="返回游戏中心 / Back to Hub">← HUB</a>

  <!-- Mute toggle (top-right) -->
  <button id="btn-mute" type="button" title="静音 / 声音 (M)">🔊</button>

  <!-- HUD container (rendered over canvas) -->
  <div id="hud">
    <div id="weapon-bar"></div>
    <div id="power-bar-wrap"><div id="power-bar"></div></div>
    <div id="wind-indicator"></div>
  </div>

  <!-- Turn banner (transient) -->
  <div id="turn-banner"><span id="turn-banner-text"></span></div>

  <!-- ── Overlay: Main Menu ─────────────────────────────────────────── -->
  <div id="overlay-menu" class="overlay show">
    <div class="panel">
      <h1 class="game-title">🪱 炮炮虫</h1>
      <p class="game-sub">BOOM WORMS · 回合制炮战</p>

      <div class="btn-col">
        <button id="btn-solo" class="big-btn" type="button">🎮 单人闯关</button>
        <button id="btn-duo"  class="big-btn ghost" type="button">👥 双人对战</button>
      </div>

      <label class="wind-toggle">
        <input type="checkbox" id="chk-wind" /> 开启风力 🌬️
      </label>

      <p id="menu-best" class="best-line">🏆 最远进度：第 1 关</p>

      <div class="hints">
        <span><b>← →</b> 移动</span>
        <span><b>Z</b> 跳跃</span>
        <span><b>↑ ↓</b> 瞄准角度</span>
        <span><b>空格</b> 蓄力发射</span>
        <span><b>1-5</b> 直接选武器</span>
        <span><b>Q / E</b> 换武器</span>
        <span><b>Esc</b> 暂停</span>
        <span><b>鼠标</b> 移动瞄准 · 左键蓄力</span>
        <span><b>手柄</b> 摇杆移动 · ✕跳 · □蓄力</span>
      </div>
    </div>
  </div>

  <!-- ── Overlay: Level Select (route map) ──────────────────────────── -->
  <div id="overlay-levelselect" class="overlay">
    <div class="panel panel-wide">
      <h1 class="game-title">🗺️ 选择关卡</h1>
      <p id="levelselect-progress" class="best-line">🏆 还未通关任何关卡</p>
      <div id="levelselect-scroll">
        <div id="levelselect-track"><!-- nodes injected by main.js --></div>
      </div>
      <div class="btn-col">
        <button id="btn-ls-back" class="big-btn ghost" type="button">← 返回菜单</button>
      </div>
      <p class="tiny">点亮的关卡可重玩 · ▶ 为下一关 · 🔒 尚未解锁</p>
    </div>
  </div>

  <!-- ── Overlay: Pause ─────────────────────────────────────────────── -->
  <div id="overlay-pause" class="overlay">
    <div class="panel">
      <h1 class="game-title">⏸ 暂停</h1>
      <div class="btn-col">
        <button id="btn-resume"  class="big-btn" type="button">▶ 继续</button>
        <button id="btn-restart" class="big-btn ghost" type="button">↻ 重玩本关</button>
        <a class="big-btn ghost" href="../../index.html">← 返回 HUB</a>
      </div>
      <p class="tiny">← → 移动 · Z 跳 · 空格/鼠标左键 蓄力 · ↑↓ 瞄准</p>
    </div>
  </div>

  <!-- ── Overlay: Level Clear ──────────────────────────────────────── -->
  <div id="overlay-levelclear" class="overlay">
    <div class="panel">
      <h1 class="game-title">🎉 关卡通过！</h1>
      <p id="lc-msg" class="best-line"></p>
      <div class="btn-col">
        <button id="btn-next" class="big-btn" type="button">下一关 →</button>
      </div>
      <p class="tiny">消灭所有敌虫，继续冒险！</p>
    </div>
  </div>

  <!-- ── Overlay: Game Over ─────────────────────────────────────────── -->
  <div id="overlay-gameover" class="overlay">
    <div class="panel">
      <h1 class="game-title">💥 再接再厉！</h1>
      <p id="go-msg" class="best-line"></p>
      <div class="btn-col">
        <button id="btn-retry"   class="big-btn" type="button">↻ 重玩本关</button>
        <button id="btn-go-menu" class="big-btn ghost" type="button">🏠 返回菜单</button>
        <a class="big-btn ghost" href="../../index.html">← 返回 HUB</a>
      </div>
    </div>
  </div>

  <!-- ── Overlay: Win ───────────────────────────────────────────────── -->
  <div id="overlay-win" class="overlay">
    <div class="panel">
      <h1 class="game-title">🏆 全部通关！</h1>
      <p id="win-msg" class="best-line"></p>
      <div class="btn-col">
        <button id="btn-win-replay" class="big-btn" type="button">↻ 再玩一次</button>
        <a class="big-btn ghost" href="../../index.html">← 返回 HUB</a>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
