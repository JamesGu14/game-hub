<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#161d2e" />
  <title>群雄逐鹿·孟德篇 · 三国战棋 SRPG</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/" } }
  </script>
</head>
<body>
  <!-- Isometric battlefield render target -->
  <canvas id="game"></canvas>

  <!-- Back to Hub (top-left) -->
  <a id="back-to-hub" href="../../index.html" title="返回游戏中心 / Back to Hub">← HUB</a>

  <!-- Mute toggle (top-right) -->
  <button id="btn-mute" type="button" title="静音 / 声音 (M)">🔊</button>

  <!-- Transient turn / phase banner (filled by battle flow) -->
  <div id="turn-banner" class="turn-banner"></div>

  <!-- HUD: unit info card, action menu anchors, phase hint (filled by ui/hud.js) -->
  <div id="hud" class="hud"></div>

  <!-- Menus: title / pause / result / save-load (filled by ui/menus.js) -->
  <div id="menus" class="menus"></div>

  <!-- Dialogue + portrait overlay (filled by story/dialogue.js) -->
  <div id="dialogue" class="dialogue"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
